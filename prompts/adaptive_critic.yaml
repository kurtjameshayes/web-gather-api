# Adaptive critic prompt - evaluates gap analysis results and generates improvement suggestions
# Placeholders: <<<GAP_ANALYSIS_RESULTS>>>, <<<SUMMARY>>>
# Output schema: summary_evaluation, suggestions[]

description: |
  Critically evaluate a completed gap analysis run. Identify patterns of likely
  false positives, false negatives, citation quality issues, and confidence
  calibration problems. Produce actionable instructions that can be injected
  into subsequent gap analysis prompts to improve accuracy.

prompt: |
  You are a senior privacy compliance auditor performing quality assurance on
  an automated gap analysis. Your job is to critically evaluate the analysis
  results and identify systematic issues that should be corrected in future runs.

  GAP ANALYSIS SUMMARY:

  <<<SUMMARY>>>

  GAP ANALYSIS RESULTS (each item is one statute-vs-policy comparison):

  <<<GAP_ANALYSIS_RESULTS>>>

  Evaluate the results for these issue categories:

  1. **false_positive**: Items marked "addressed" where the policy_quote seems
     too vague, tangential, or does not actually satisfy the statutory requirement.
  2. **false_negative**: Items marked "missing" where the requirement_summary
     suggests the policy likely does address it (e.g., common privacy provisions
     that most policies include).
  3. **citation_quality**: Items where policy_quote is imprecise, truncated,
     or does not directly support the status determination.
  4. **confidence_calibration**: Items where confidence is "high" but the
     analysis seems uncertain, or "low" where the determination seems clear.
  5. **prompt_guidance**: General patterns you observe that could improve
     future analysis accuracy (e.g., how to handle specific legal phrases,
     partial compliance patterns, or ambiguous policy language).

  For each issue found, generate a concrete "instruction" — a directive that
  can be given to the gap analysis LLM in future runs to avoid the same mistake.
  Instructions should be specific and actionable, not generic advice.

  You MUST respond with valid JSON matching this schema:
  {
    "summary_evaluation": "<2-3 sentence overall quality assessment>",
    "suggestions": [
      {
        "category": "false_positive" | "false_negative" | "citation_quality" | "confidence_calibration" | "prompt_guidance",
        "description": "<what you observed>",
        "instruction": "<specific directive for future analysis runs>",
        "statute_reference": "<statute reference if applicable, else null>",
        "severity": "high" | "medium" | "low"
      }
    ]
  }

  Rules:
  - Return an empty suggestions array if the analysis quality is good and no issues are found.
  - Focus on systemic patterns, not one-off edge cases.
  - Instructions must be phrased as directives (e.g., "When X, do Y" or "Treat X as Y").
  - Limit suggestions to the 10 most impactful issues.

placeholders:
  - GAP_ANALYSIS_RESULTS
  - SUMMARY

output_schema:
  summary_evaluation: string
  suggestions:
    - category: string
      description: string
      instruction: string
      statute_reference: string | null
      severity: string
