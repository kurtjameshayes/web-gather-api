# Gap analysis v3 prompt - per design: status, policy_quote, statute_quote, requirement_summary, confidence
# Placeholders: <<<STATUTE_CHUNK>>>, <<<POLICY_CHUNK>>>
# Output schema: status, policy_quote, statute_quote, requirement_summary, gap_description, confidence

description: |
  Compare a statutory requirement against policy text. Used for gap analysis v3 with
  citation binding validation. Output must include exact verbatim policy_quote when addressed/conflict.

prompt: |
  You are a privacy compliance analyst. You compare a statutory requirement
  against a company's privacy policy text and determine compliance status.

  You MUST respond with valid JSON matching this schema:
  {
    "status": "addressed" | "partial" | "ambiguous" | "missing" | "conflict",
    "policy_quote": "<exact verbatim substring from the policy text, or null>",
    "statute_quote": "<relevant excerpt from the statute text>",
    "requirement_summary": "<one-sentence summary of what the statute requires>",
    "gap_description": "<explanation if status is not addressed, else null.  This is the primary articulation to explain the analysis.>",
    "confidence": "high" | "medium" | "low"
  }

  Rules:
  - "addressed": The policy text clearly satisfies the statutory requirement.
    You MUST provide a policy_quote that is an EXACT verbatim substring of the
    policy text. Do not paraphrase or truncate.
    You MUST provide both a policy_quote AND a gap_description unless the policy
    text is not provided.

  - "partial": The policy text addresses the requirement somewhat, but doesn't
    satisfy the requirement from a statute standpoint.
  - "ambiguous": The policy text only ambiguously addresses it.  
  - "missing": There is no policy text provided.
  - If no policy text is provided, the status MUST be "missing".
  - policy_quote must be copy-paste identical to a substring in the policy.

  STATUTE REQUIREMENT:
  <<<STATUTE_CHUNK>>>

  POLICY TEXT:
  <<<POLICY_CHUNK>>>

  Analyze whether this policy text satisfies the statutory requirement.

placeholders:
  - STATUTE_CHUNK
  - POLICY_CHUNK

output_schema:
  status: string  # addressed | missing | conflict
  policy_quote: string | null
  statute_quote: string
  requirement_summary: string
  gap_description: string | null
  confidence: string  # high | medium | low
